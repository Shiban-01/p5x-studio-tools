<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; width:1200px; height:750px; overflow:hidden; display:flex; }
:root {
  --bg:#E8F5E9;
  --sidebar:#C8E6C9;
  --card:#FFFFFF;
  --text:#1B5E20;
  --muted:#6B8E7B;
  --accent:#43A047;
  --accent2:#66BB6A;
  --border:#A5D6A7;
  --chip:#C8E6C9;
}
.sidebar { width:220px; background:var(--sidebar); padding:20px 0; display:flex; flex-direction:column; border-right:2px solid var(--border); }
.logo { padding:0 20px 20px; border-bottom:1px solid var(--border); }
.logo b { font-size:20px; color:var(--accent); display:block; }
.logo span { font-size:12px; color:var(--muted); }
.nav { flex:1; padding:15px 0; }
.nav a { display:flex; align-items:center; gap:10px; padding:10px 20px; color:var(--text); text-decoration:none; font-size:14px; border-left:3px solid transparent; }
.nav a.active { background:var(--accent); color:#fff; border-left-color:#fff; }
.nav a .badge { background:var(--accent2); color:#fff; font-size:10px; padding:2px 6px; border-radius:8px; margin-left:auto; }
.main { flex:1; padding:25px 30px; background:var(--bg); }
h1 { color:var(--accent); font-size:22px; margin-bottom:5px; }
.sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
.search { width:100%; padding:10px 15px; border:2px solid var(--border); border-radius:10px; font-size:14px; margin-bottom:15px; background:var(--card); color:var(--text); }
.chips { display:flex; gap:8px; margin-bottom:15px; flex-wrap:wrap; }
.chip { padding:5px 12px; background:var(--chip); border:1px solid var(--border); border-radius:15px; font-size:12px; color:var(--text); }
.chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.results { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
.results .header { display:flex; justify-content:space-between; align-items:center; padding:12px 15px; border-bottom:1px solid var(--border); }
.results .header h2 { font-size:16px; color:var(--text); }
.row { display:flex; align-items:center; padding:10px 15px; border-bottom:1px solid var(--border); gap:15px; }
.row:hover { background:var(--chip); }
.row .name { flex:1; }
.row .name b { font-size:13px; color:var(--text); display:block; }
.row .name s { font-size:11px; color:var(--muted); text-decoration:none; }
.row .k { font-size:12px; color:var(--muted); width:80px; text-align:right; }
.row .badge { width:8px; height:8px; border-radius:50%; background:var(--accent); flex-shrink:0; }
</style></head><body>
<div class="sidebar">
  <div class="logo"><b>P5X Studio</b><span>Tools v0.0.3</span></div>
  <div class="nav">
    <a>📦 Bundles</a>
    <a>🔍 Inspector</a>
    <a>🔎 Resources</a>
    <a>🎬 Video & Audio</a>
    <a>🖼 Bulk Textures <span class="badge">2.4k</span></a>
    <a>👤 Bust-ups <span class="badge">266</span></a>
    <a>⚙ Dependencies</a>
  </div>
</div>
<div class="main">
  <h1>Settings</h1>
  <div class="sub">Customize the app theme, language, and game paths.</div>
  
  <div style="display:flex;flex-direction:column;gap:15px">
    <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px">
      <h3 style="color:var(--text);margin-bottom:12px">Theme</h3>
      <div style="display:flex;gap:12px">
        <div style="width:36px;height:36px;border-radius:50%;background:#E91E63;border:3px solid var(--accent);cursor:pointer"></div>
        <div style="width:36px;height:36px;border-radius:50%;background:#78909C;border:3px solid transparent;cursor:pointer"></div>
        <div style="width:36px;height:36px;border-radius:50%;background:#1A1A2E;border:3px solid transparent;cursor:pointer"></div>
        <div style="width:36px;height:36px;border-radius:50%;background:#43A047;border:3px solid transparent;cursor:pointer"></div>
        <div style="width:36px;height:36px;border-radius:50%;background:#795548;border:3px solid transparent;cursor:pointer"></div>
        <div style="width:36px;height:36px;border-radius:50%;background:#F57C00;border:3px solid transparent;cursor:pointer"></div>
        <div style="width:36px;height:36px;border-radius:50%;background:#D32F2F;border:3px solid transparent;cursor:pointer"></div>
        <div style="width:36px;height:36px;border-radius:50%;background:#8E24AA;border:3px solid transparent;cursor:pointer"></div>
        <div style="width:36px;height:36px;border-radius:50%;background:#1976D2;border:3px solid transparent;cursor:pointer"></div>
        <div style="width:36px;height:36px;border-radius:50%;background:#F9A825;border:3px solid transparent;cursor:pointer"></div>
      </div>
    </div>
    <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px">
      <h3 style="color:var(--text);margin-bottom:8px">Game Installation</h3>
      <div style="display:flex;gap:10px">
        <input class="search" style="flex:1;margin:0" value="C:\Program Files (x86)\Steam\steamapps\common\P5X">
        <button style="padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:13px">Browse...</button>
      </div>
    </div>
    <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px">
      <h3 style="color:var(--text);margin-bottom:8px">Output Folder</h3>
      <div style="display:flex;gap:10px">
        <input class="search" style="flex:1;margin:0" value="C:\Users\Lukas\Desktop\P5X Studio Tools\extracted">
        <button style="padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:13px">Browse...</button>
      </div>
    </div>
    <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;display:flex;justify-content:space-between;align-items:center">
      <div><b style="color:var(--text)">Version</b><br><span style="color:var(--muted);font-size:12px">0.0.3-beta</span></div>
      <button style="padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:13px">Check for Updates</button>
    </div>
  </div>
</div>
</body></html>
